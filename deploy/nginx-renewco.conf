# renewCo. — Nginx reverse proxy to the Node app on 127.0.0.1:4000
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # CSV and evidence uploads are sent as base64 JSON (up to ~36 MB).
    client_max_body_size 40m;

    # Live market feed (Server-Sent Events): no buffering, long timeout.
    location /api/market/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
